parameters:
    tables.wiki.article: '%core.table_prefix%wiki_article'
    tables.wiki.file: '%core.table_prefix%wiki_file'
    tables.wiki.watch: '%core.table_prefix%wiki_watch'
    tables.wiki.search_text: '%core.table_prefix%wiki_search_text'
    tables.wiki.search_results: '%core.table_prefix%wiki_search_results'
    tables.wiki.search_wordlist: '%core.table_prefix%wiki_src_wrdlist'
    tables.wiki.search_wordmatch: '%core.table_prefix%wiki_src_wrdmtch'
    tables.wiki.template_install: '%core.table_prefix%wiki_template_install'
    tables.wiki.edit_lock: '%core.table_prefix%wiki_edit_lock'
    tables.wiki.article_protect: '%core.table_prefix%wiki_article_protect'

services:
    _defaults:
        public: true

    phpbbmodders.wiki.overview:
            class: phpbbmodders\wiki\controller\overview
            arguments:
                - '@auth'
                - '@controller.helper'
                - '@dbal.conn'
                - '@request'
                - '@template'
                - '@user'
                - '@phpbbmodders.wiki.edit'
                - '@phpbbmodders.wiki.compare'
                - '@phpbbmodders.wiki.view'
                - '%core.root_path%'
                - '%core.php_ext%'
                - '%tables.wiki.article%'
                - '@phpbbmodders.wiki.protection'

    phpbbmodders.wiki.recent_changes:
        class: phpbbmodders\wiki\controller\recent_changes
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.protection'

    phpbbmodders.wiki.categories:
        class: phpbbmodders\wiki\wiki\categories
        arguments:
            - '@dbal.conn'
            - '@phpbbmodders.wiki.templates'
            - '%tables.wiki.article%'

    phpbbmodders.wiki.category:
        class: phpbbmodders\wiki\controller\category
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.categories'
            - '@phpbbmodders.wiki.main'
            - '%tables.wiki.article%'
            - '@phpbbmodders.wiki.protection'

    phpbbmodders.wiki.template_list:
        class: phpbbmodders\wiki\controller\template_list
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.links'
            - '@phpbbmodders.wiki.templates'
            - '%tables.wiki.article%'

    phpbbmodders.wiki.contributions:
        class: phpbbmodders\wiki\controller\contributions
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'

    phpbbmodders.wiki.watch:
        class: phpbbmodders\wiki\wiki\watch
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.watch%'
            - '%tables.wiki.article%'

    phpbbmodders.wiki.files:
        class: phpbbmodders\wiki\wiki\files
        arguments:
            - '@auth'
            - '@cache'
            - '@config'
            - '@dbal.conn'
            - '@files.factory'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.file%'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.protection'

    phpbbmodders.wiki.main:
        class: phpbbmodders\wiki\controller\main
        arguments:
            - '@auth'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.delete'
            - '@phpbbmodders.wiki.edit'
            - '@phpbbmodders.wiki.compare'
            - '@phpbbmodders.wiki.view'
            - '@phpbbmodders.wiki.discussion'
            - '@phpbbmodders.wiki.files'
            - '@phpbbmodders.wiki.watch'
            - '@phpbbmodders.wiki.move'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.protect'
    phpbbmodders.wiki.move:
        class: phpbbmodders\wiki\wiki\move
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.links'
            - '@phpbbmodders.wiki.search_sync'
            - '%tables.wiki.article%'
            - '%tables.wiki.file%'
            - '%tables.wiki.watch%'
            - '@phpbbmodders.wiki.protection'
    phpbbmodders.wiki.listener:
        class: phpbbmodders\wiki\event\listener
        arguments:
            - '@auth'
            - '@config'
            - '@controller.helper'
            - '@notification_manager'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.watch'
        tags:
            - { name: event.listener }
    phpbbmodders.wiki.edit:
        class: phpbbmodders\wiki\wiki\edit
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@notification_manager'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.watch'
            - '@phpbbmodders.wiki.templates'
            - '@phpbbmodders.wiki.search_sync'
            - '@phpbbmodders.wiki.edit_lock'
            - '@phpbbmodders.wiki.protection'
    # Per-article edit protection: which groups may edit an article, and the page that sets it
    phpbbmodders.wiki.protection:
        class: phpbbmodders\wiki\wiki\protection
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@group_helper'
            - '@user'
            - '%tables.wiki.article_protect%'
    phpbbmodders.wiki.protect:
        class: phpbbmodders\wiki\wiki\protect
        arguments:
            - '@dbal.conn'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.protection'
            - '%tables.wiki.article%'
    # Who has an article's edit form open: the notice on the edit form and the optional lock
    phpbbmodders.wiki.edit_lock:
        class: phpbbmodders\wiki\wiki\edit_lock
        arguments:
            - '@config'
            - '@dbal.conn'
            - '%tables.wiki.edit_lock%'
    phpbbmodders.wiki.compare:
        class: phpbbmodders\wiki\wiki\compare
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.protection'
    phpbbmodders.wiki.delete:
        class: phpbbmodders\wiki\wiki\delete
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@controller.helper'
            - '@user'
            - '%tables.wiki.article%'
            - '@phpbbmodders.wiki.files'
            - '@request'
            - '@phpbbmodders.wiki.watch'
            - '@phpbbmodders.wiki.search_sync'
            - '@phpbbmodders.wiki.protection'
    phpbbmodders.wiki.view:
        class: phpbbmodders\wiki\wiki\view
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@controller.helper'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.compare'
            - '@phpbbmodders.wiki.edit'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.links'
            - '@phpbbmodders.wiki.discussion'
            - '@phpbbmodders.wiki.files'
            - '@phpbbmodders.wiki.watch'
            - '@phpbbmodders.wiki.templates'
            - '@phpbbmodders.wiki.protection'
    phpbbmodders.wiki.discussion:
        class: phpbbmodders\wiki\wiki\discussion
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@request'
            - '@user'
            - '%tables.wiki.article%'
            - '%core.root_path%'
            - '%core.php_ext%'
    phpbbmodders.wiki.links:
        class: phpbbmodders\wiki\wiki\links
        arguments:
            - '@dbal.conn'
            - '%tables.wiki.article%'
    phpbbmodders.wiki.templates:
        class: phpbbmodders\wiki\wiki\templates
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '%tables.wiki.article%'
    phpbbmodders.wiki.wikilink_listener:
        class: phpbbmodders\wiki\event\wikilink_listener
        arguments:
            - '@controller.helper'
            - '@language'
            - '@phpbbmodders.wiki.links'
            - '@phpbbmodders.wiki.files'
            - '@phpbbmodders.wiki.templates'
        tags:
            - { name: event.listener }

    phpbbmodders.wiki.notification.type.article_edit:
        class: phpbbmodders\wiki\notification\article_edit
        parent: notification.type.base
        # Symfony 3.4 (phpBB 3.3.x) does not let a service with a parent take "public" from _defaults.
        public: true
        shared: false
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_helper, ['@controller.helper']]
        tags:
            - { name: notification.type }
    phpbbmodders.wiki.text_reparser.article_text:
        class: phpbbmodders\wiki\textreparser\plugins\article_text
        arguments:
            - '@dbal.conn'
            - '%tables.wiki.article%'
        calls:
            - [set_name, [phpbbmodders_wiki_article]]
        tags:
            - { name: text_reparser.plugin}
    phpbbmodders.wiki.notification.type.article_watch:
        class: phpbbmodders\wiki\notification\article_watch
        parent: notification.type.base
        # Symfony 3.4 (phpBB 3.3.x) does not let a service with a parent take "public" from _defaults.
        public: true
        shared: false
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_helper, ['@controller.helper']]
            - [set_watch, ['@phpbbmodders.wiki.watch']]
        tags:
            - { name: notification.type }
    phpbbmodders.wiki.notification.type.edit_lock_blocked:
        class: phpbbmodders\wiki\notification\edit_lock_blocked
        parent: notification.type.base
        # Symfony 3.4 (phpBB 3.3.x) does not let a service with a parent take "public" from _defaults.
        public: true
        shared: false
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_helper, ['@controller.helper']]
        tags:
            - { name: notification.type }
    phpbbmodders.wiki.notification.type.starter_templates:
        class: phpbbmodders\wiki\notification\starter_templates
        parent: notification.type.base
        # Symfony 3.4 (phpBB 3.3.x) does not let a service with a parent take "public" from _defaults.
        public: true
        shared: false
        tags:
            - { name: notification.type }

    # Search: the three backends, the factory that picks the active one, and the
    # service that keeps the search's copy of the articles current
    phpbbmodders.wiki.search.fulltext.mysql:
        class: phpbbmodders\wiki\search\backend\wiki_fulltext_mysql
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.wiki.search_text%'
            - '%tables.wiki.search_results%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.wiki.search.backend }

    phpbbmodders.wiki.search.fulltext.native:
        class: phpbbmodders\wiki\search\backend\wiki_fulltext_native
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.wiki.search_text%'
            - '%tables.wiki.search_results%'
            - '%tables.wiki.search_wordmatch%'
            - '%tables.wiki.search_wordlist%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.wiki.search.backend }

    phpbbmodders.wiki.search.fulltext.postgres:
        class: phpbbmodders\wiki\search\backend\wiki_fulltext_postgres
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.wiki.search_text%'
            - '%tables.wiki.search_results%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.wiki.search.backend }

    phpbbmodders.wiki.search.backend_collection:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: phpbbmodders.wiki.search.backend, class_name_aware: true }

    phpbbmodders.wiki.search.backend_factory:
        class: phpbbmodders\wiki\search\wiki_search_backend_factory
        arguments:
            - '@config'
            - '@phpbbmodders.wiki.search.backend_collection'

    phpbbmodders.wiki.search_sync:
        class: phpbbmodders\wiki\wiki\search_sync
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@phpbbmodders.wiki.search.backend_factory'
            - '%tables.wiki.article%'
            - '%tables.wiki.search_text%'

    phpbbmodders.wiki.acp_search:
        class: phpbbmodders\wiki\controller\acp_search
        arguments:
            - '@config'
            - '@language'
            - '@log'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.search.backend_collection'
            - '@phpbbmodders.wiki.search.backend_factory'
            - '@phpbbmodders.wiki.search_sync'

    # runs a keyword search and turns the matches into rows for a template
    phpbbmodders.wiki.search_results:
        class: phpbbmodders\wiki\wiki\search_results
        arguments:
            - '@dbal.conn'
            - '@controller.helper'
            - '@user'
            - '@phpbbmodders.wiki.search.backend_factory'
            - '%tables.wiki.article%'
            - '%tables.wiki.search_text%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@phpbbmodders.wiki.protection'

    phpbbmodders.wiki.search:
        class: phpbbmodders\wiki\controller\search
        arguments:
            - '@auth'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.search.backend_factory'
            - '@phpbbmodders.wiki.search_results'
            - '%core.root_path%'
            - '%core.php_ext%'

    phpbbmodders.wiki.search_listener:
        class: phpbbmodders\wiki\event\search_listener
        arguments:
            - '@auth'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@request'
            - '@template'
            - '@phpbbmodders.wiki.search.backend_factory'
            - '@phpbbmodders.wiki.search_results'
        tags:
            - { name: event.listener }

    # Starter templates: installs templates from the phpbbmodders/wiki-templates repository,
    # and the check (off unless switched on) that tells admins when it has new ones
    phpbbmodders.wiki.starter_templates:
        class: phpbbmodders\wiki\wiki\starter_templates
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@file_downloader'
            - '@filesystem'
            - '@language'
            - '@log'
            - '@notification_manager'
            - '@phpbbmodders.wiki.edit'
            - '%tables.wiki.article%'
            - '%tables.wiki.template_install%'
            - '%core.root_path%'

    phpbbmodders.wiki.acp_templates:
        class: phpbbmodders\wiki\controller\acp_templates
        arguments:
            - '@config'
            - '@files.factory'
            - '@language'
            - '@log'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.wiki.starter_templates'

    phpbbmodders.wiki.cron.task.starter_templates_check:
        class: phpbbmodders\wiki\cron\task\starter_templates_check
        arguments:
            - '@phpbbmodders.wiki.starter_templates'
        calls:
            - [set_name, [cron.task.phpbbmodders.wiki.starter_templates_check]]
        tags:
            - { name: cron.task }
