phpbbmodders_wiki_index:
    path: /wiki/
    defaults: { _controller: phpbbmodders.wiki.overview:base }

phpbbmodders_wiki_recent_changes_feed:
    path: /wiki/recent-changes.{_format}
    defaults: { _controller: phpbbmodders.wiki.recent_changes:feed }
    requirements:
        _format: rss|atom

phpbbmodders_wiki_recent_changes:
    path: /wiki/recent-changes
    defaults: { _controller: phpbbmodders.wiki.recent_changes:page }

phpbbmodders_wiki_categories:
    path: /wiki/categories
    defaults: { _controller: phpbbmodders.wiki.category:index }

phpbbmodders_wiki_category:
    path: /wiki/Category:{name}
    defaults: { _controller: phpbbmodders.wiki.category:page }
    requirements:
        name: .+

phpbbmodders_wiki_templates:
    path: /wiki/templates
    defaults: { _controller: phpbbmodders.wiki.template_list:page }

phpbbmodders_wiki_contributions:
    path: /wiki/contributions/{username}
    defaults: { _controller: phpbbmodders.wiki.contributions:view }
    requirements:
        username: .+

phpbbmodders_wiki_article:
    path: /wiki/{article}
    defaults: { _controller: phpbbmodders.wiki.main:article, article: "" }


