<!-- INCLUDE overall_header.html -->
<h2>{L_WIKI_MOVE_ARTICLE}{L_COLON} {ARTICLE_NAME}</h2>

<form id="wiki_move" method="post" action="{U_ACTION}">
<div class="panel">
	<div class="inner">
		<p>{L_WIKI_MOVE_EXPLAIN}</p>
		<!-- IF ERROR --><p class="error">{ERROR}</p><!-- ENDIF -->
		<fieldset class="fields1">
			<dl>
				<dt><label for="new_name">{L_WIKI_MOVE_NEW_NAME}{L_COLON}</label><br><span>{L_WIKI_MOVE_NEW_NAME_EXPLAIN}</span></dt>
				<dd><input type="text" name="new_name" id="new_name" size="45" maxlength="255" value="{NEW_NAME}" class="inputbox autowidth" required></dd>
			</dl>
			<dl>
				<dt><label for="new_title">{L_WIKI_MOVE_NEW_TITLE}{L_COLON}</label></dt>
				<dd><input type="text" name="new_title" id="new_title" size="45" maxlength="255" value="{NEW_TITLE}" class="inputbox autowidth" required></dd>
			</dl>
			<dl>
				<dt>&nbsp;</dt>
				<dd><label for="leave_redirect"><input type="checkbox" name="leave_redirect" id="leave_redirect" value="1"<!-- IF S_LEAVE_REDIRECT --> checked="checked"<!-- ENDIF -->> {L_WIKI_MOVE_LEAVE_REDIRECT}</label></dd>
			</dl>
			<!-- IF TEMPLATE_USED_BY -->
			<dl>
				<dt>&nbsp;</dt>
				<dd>
					<p class="error">{TEMPLATE_USED_BY}</p>
					<label for="confirm_template"><input type="checkbox" name="confirm_template" id="confirm_template" value="1"> {L_WIKI_MOVE_TEMPLATE_CONFIRM}</label>
				</dd>
			</dl>
			<!-- ENDIF -->
		</fieldset>
	</div>
</div>

<div class="panel bg2">
	<div class="inner">
		<fieldset class="submit-buttons">
			<input type="submit" name="cancel" value="{L_CANCEL}" class="button2">
			<input type="submit" name="submit" value="{L_WIKI_MOVE_ARTICLE}" class="button1">
			{S_FORM_TOKEN}
		</fieldset>
	</div>
</div>
</form>
<!-- INCLUDE overall_footer.html -->
