<!-- INCLUDE overall_header.html -->
<h2>{L_WIKI_SEARCH}</h2>

<!-- IF S_SEARCH_NOT_BUILT -->
<div class="panel"><div class="inner">
	<p>{L_WIKI_SEARCH_NOT_BUILT}<!-- IF U_ACP_SEARCH --> <a href="{U_ACP_SEARCH}">{L_WIKI_SEARCH_BUILD}</a><!-- ENDIF --></p>
</div></div>
<!-- ENDIF -->

<form method="get" action="{U_SEARCH}" class="wiki-search-form">
	<div class="panel">
		<div class="inner">
			<fieldset>
				<dl>
					<dt><label for="keywords">{L_SEARCH_KEYWORDS}{L_COLON}</label><br><span>{L_SEARCH_KEYWORDS_EXPLAIN}</span></dt>
					<dd><input type="search" class="inputbox" name="keywords" id="keywords" size="40" value="{KEYWORDS}"></dd>
					<dd>
						<label for="terms_all"><input type="radio" name="terms" id="terms_all" value="all"<!-- IF not S_TERMS_ANY --> checked="checked"<!-- ENDIF -->> {L_SEARCH_ALL_TERMS}</label>
						<label for="terms_any"><input type="radio" name="terms" id="terms_any" value="any"<!-- IF S_TERMS_ANY --> checked="checked"<!-- ENDIF -->> {L_SEARCH_ANY_TERMS}</label>
					</dd>
				</dl>
				<dl>
					<dt><label for="sf">{L_WIKI_SEARCH_IN}{L_COLON}</label></dt>
					<dd>
						<select name="sf" id="sf">
							<option value="all"<!-- IF S_FIELDS == 'all' --> selected="selected"<!-- ENDIF -->>{L_WIKI_SEARCH_IN_ALL}</option>
							<option value="titleonly"<!-- IF S_FIELDS == 'titleonly' --> selected="selected"<!-- ENDIF -->>{L_WIKI_SEARCH_IN_TITLES}</option>
							<option value="msgonly"<!-- IF S_FIELDS == 'msgonly' --> selected="selected"<!-- ENDIF -->>{L_WIKI_SEARCH_IN_TEXT}</option>
						</select>
					</dd>
				</dl>
				<dl>
					<dt><label for="sk">{L_SORT_BY}{L_COLON}</label></dt>
					<dd>
						<select name="sk" id="sk">
							<option value="t"<!-- IF S_SORT_KEY == 't' --> selected="selected"<!-- ENDIF -->>{L_WIKI_SORT_DATE}</option>
							<option value="s"<!-- IF S_SORT_KEY == 's' --> selected="selected"<!-- ENDIF -->>{L_WIKI_SORT_TITLE}</option>
						</select>
						<select name="sd">
							<option value="d"<!-- IF S_SORT_DIR == 'd' --> selected="selected"<!-- ENDIF -->>{L_SORT_DESCENDING}</option>
							<option value="a"<!-- IF S_SORT_DIR == 'a' --> selected="selected"<!-- ENDIF -->>{L_SORT_ASCENDING}</option>
						</select>
					</dd>
				</dl>
				<dl>
					<dt>&nbsp;</dt>
					<dd><input type="submit" class="button1" value="{L_SEARCH}"></dd>
				</dl>
			</fieldset>
		</div>
	</div>
</form>

<!-- IF S_RESULTS -->
<h3>{SEARCH_MATCHES}</h3>
<!-- IF .results -->
	<!-- BEGIN results -->
	<div class="search post <!-- IF results.S_ROW_COUNT is odd -->bg1<!-- ELSE -->bg2<!-- ENDIF -->">
		<div class="inner">
			<div class="postbody">
				<h3><a href="{results.U_ARTICLE}">{results.TITLE}</a><!-- IF results.PROTECTED --> <i class="icon o-icon o-icon-font fas fa-lock fa-fw wiki-protected-icon" title="{results.PROTECTED}" aria-hidden="true"></i><span class="sr-only">{results.PROTECTED}</span><!-- ENDIF --></h3>
				<!-- IF results.DESCRIPTION --><p class="author">{results.DESCRIPTION}</p><!-- ENDIF -->
				<!-- IF results.SNIPPET --><div class="content">{results.SNIPPET}</div><!-- ENDIF -->
				<p class="author">{results.DATE}<!-- IF results.AUTHOR --> &bull; {results.AUTHOR}<!-- ENDIF --></p>
			</div>
		</div>
	</div>
	<!-- END results -->
<!-- ELSE -->
	<p>{L_WIKI_SEARCH_NO_RESULTS}</p>
<!-- ENDIF -->
<div class="action-bar bottom">
	<div class="pagination">
		{TOTAL_ITEMS}
		<!-- IF .pagination -->
			<!-- INCLUDE pagination.html -->
		<!-- ELSE -->
			 &bull; {PAGE_NUMBER}
		<!-- ENDIF -->
	</div>
</div>
<!-- ENDIF -->

<!-- INCLUDE overall_footer.html -->
