<h3>{L_WIKI_CATEGORY_MEMBERS}</h3>
<!-- IF .category_members -->
<div class="forumbg forumbg-table">
	<div class="inner">
		<table class="table1">
			<thead>
				<tr>
					<th>{L_CONTRIBUTIONS_ARTICLE}</th>
					<th>{L_WIKI_TEMPLATE_DESCRIPTION}</th>
				</tr>
			</thead>
			<tbody>
				<!-- BEGIN category_members -->
				<tr class="<!-- IF category_members.S_ROW_COUNT is even -->bg1<!-- ELSE -->bg2<!-- ENDIF -->">
					<td><a href="{category_members.U_ARTICLE}"><strong>{category_members.TITLE}</strong></a><!-- IF category_members.PROTECTED --> <i class="icon o-icon o-icon-font fas fa-lock fa-fw wiki-protected-icon" title="{category_members.PROTECTED}" aria-hidden="true"></i><span class="sr-only">{category_members.PROTECTED}</span><!-- ENDIF --></td>
					<td>{category_members.DESCRIPTION}</td>
				</tr>
				<!-- END category_members -->
			</tbody>
		</table>
	</div>
</div>
<!-- ELSE -->
<p>{L_WIKI_CATEGORY_EMPTY}</p>
<!-- ENDIF -->
<div class="action-bar bottom">
	<div class="pagination">
		{CATEGORY_TOTAL}
		<!-- IF .pagination -->
			<!-- INCLUDE pagination.html -->
		<!-- ENDIF -->
	</div>
</div>
