<!-- INCLUDE overall_header.html -->


<h1>{L_ACP_WIKI_BBCODES}</h1>

<p>{WIKI_ONLY_BBCODES_EXPLAIN}</p>

<form id="wiki_bbcodes" method="post" action="{U_ACTION}">
	<fieldset>
		<legend>{L_WIKI_ONLY_BBCODES}</legend>
		<!-- BEGIN wiki_only_bbcodes -->
		<dl>
			<dt><label for="wiki_only_bbcode_{wiki_only_bbcodes.ID}">[{wiki_only_bbcodes.TAG}]</label><!-- IF wiki_only_bbcodes.HELPLINE --><br><span>{wiki_only_bbcodes.HELPLINE}</span><!-- ENDIF --></dt>
			<dd><label><input type="checkbox" class="radio" id="wiki_only_bbcode_{wiki_only_bbcodes.ID}" name="wiki_only_bbcodes[]" value="{wiki_only_bbcodes.ID}"<!-- IF wiki_only_bbcodes.S_CHECKED --> checked="checked"<!-- ENDIF -->> {L_WIKI_ONLY_BBCODE}</label></dd>
		</dl>
		<!-- BEGINELSE -->
		<p><strong>{WIKI_ONLY_BBCODES_NONE}</strong></p>
		<!-- END wiki_only_bbcodes -->
	</fieldset>

	<fieldset class="submit-buttons">
		<legend>{L_SUBMIT}</legend>
		<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}">
		<input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}">
		{S_FORM_TOKEN}
	</fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
