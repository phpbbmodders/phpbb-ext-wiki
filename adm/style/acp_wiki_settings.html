<!-- INCLUDE overall_header.html -->


<h1>{L_ACP_WIKI_SETTINGS}</h1>

<p>{L_ACP_WIKI_SETTINGS_EXPLAIN}</p>

<form id="wiki_settings" method="post" action="{U_ACTION}">
	<fieldset>
		<legend>{L_ACP_WIKI_SETTINGS}</legend>
		<dl>
			<dt><label for="wiki_icon">{L_WIKI_ICON}{L_COLON}</label><br><span>{L_WIKI_ICON_EXPLAIN}</span></dt>
			<dd><input id="wiki_icon" type="text" name="wiki_icon" size="30" maxlength="50" value="{WIKI_ICON}"></dd>
		</dl>
		<dl>
			<dt><label for="wiki_auto_watch_yes">{L_WIKI_AUTO_WATCH}{L_COLON}</label><br><span>{L_WIKI_AUTO_WATCH_EXPLAIN}</span></dt>
			<dd>
				<label><input type="radio" class="radio" id="wiki_auto_watch_yes" name="wiki_auto_watch" value="1"<!-- IF S_WIKI_AUTO_WATCH --> checked="checked"<!-- ENDIF -->> {L_YES}</label>
				<label><input type="radio" class="radio" name="wiki_auto_watch" value="0"<!-- IF not S_WIKI_AUTO_WATCH --> checked="checked"<!-- ENDIF -->> {L_NO}</label>
			</dd>
		</dl>
		<dl>
			<dt><label for="wiki_edit_conflict">{L_WIKI_EDIT_CONFLICT}{L_COLON}</label><br><span>{L_WIKI_EDIT_CONFLICT_EXPLAIN}</span></dt>
			<dd><select id="wiki_edit_conflict" name="wiki_edit_conflict">{S_WIKI_EDIT_CONFLICT_OPTIONS}</select></dd>
		</dl>
		<dl>
			<dt><label for="wiki_edit_lock_minutes">{L_WIKI_EDIT_LOCK_MINUTES}{L_COLON}</label><br><span>{L_WIKI_EDIT_LOCK_MINUTES_EXPLAIN}</span></dt>
			<dd><input id="wiki_edit_lock_minutes" type="number" min="{WIKI_EDIT_LOCK_MINUTES_MIN}" max="{WIKI_EDIT_LOCK_MINUTES_MAX}" name="wiki_edit_lock_minutes" value="{WIKI_EDIT_LOCK_MINUTES}"></dd>
		</dl>
		<dl>
			<dt><label for="wiki_feed_format">{L_WIKI_FEED_FORMAT}{L_COLON}</label><br><span>{L_WIKI_FEED_FORMAT_EXPLAIN}</span></dt>
			<dd><select id="wiki_feed_format" name="wiki_feed_format">{S_WIKI_FEED_OPTIONS}</select></dd>
		</dl>
		<dl>
			<dt><label for="wiki_discussion_forum_id">{L_WIKI_DISCUSSION_FORUM}{L_COLON}</label><br><span>{L_WIKI_DISCUSSION_FORUM_EXPLAIN}</span></dt>
			<dd><select id="wiki_discussion_forum_id" name="wiki_discussion_forum_id">{S_WIKI_FORUM_OPTIONS}</select></dd>
		</dl>
	</fieldset>

	<fieldset class="submit-buttons">
		<legend>{L_SUBMIT}</legend>
		<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}">
		<input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}">
		{S_FORM_TOKEN}
	</fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
