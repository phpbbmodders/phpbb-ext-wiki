<!-- INCLUDE overall_header.html -->

<h1>{L_ACP_WIKI_SETTINGS}</h1>

<p>{L_ACP_WIKI_SETTINGS_EXPLAIN}</p>

<form id="wiki_settings" method="post" action="{U_ACTION}">
	<fieldset>
		<legend>{L_ACP_WIKI_SETTINGS}</legend>
		<dl>
			<dt><label for="wiki_discussion_forum_id">{L_WIKI_DISCUSSION_FORUM}{L_COLON}</label><br><span>{L_WIKI_DISCUSSION_FORUM_EXPLAIN}</span></dt>
			<dd><select id="wiki_discussion_forum_id" name="wiki_discussion_forum_id">{S_WIKI_FORUM_OPTIONS}</select></dd>
		</dl>
	</fieldset>

	<fieldset class="submit-buttons">
		<legend>{L_SUBMIT}</legend>
		<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}">
		<input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}">
		{S_FORM_TOKEN}
	</fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
