name: Bug Report
description: Report a problem with the extension
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: phpbb-version
    attributes:
      label: phpBB version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Relevant error messages or logs
